name: Dehumidifier
products:
  - id: zt87jwdngs1hsaqd
    manufacturer: Cecotec
    model: BigDry 9000 Professional
entities:
  - entity: humidifier
    class: dehumidifier
    dps:
      - id: 1
        name: switch
        type: boolean
      - id: 3
        name: humidity
        type: string
        mapping:
          - dps_val: "40"
            value: 40
          - dps_val: "45"
            value: 45
          - dps_val: "50"
            value: 50
          - dps_val: "55"
            value: 55
          - dps_val: "60"
            value: 60
          - dps_val: "65"
            value: 65
          - dps_val: "70"
            value: 70
          - dps_val: "75"
            value: 75
          - dps_val: "80"
            value: 80
      - id: 6
        name: current_humidity
        type: integer
      - id: 5
        name: mode
        type: string
        mapping:
          - dps_val: dehumidify
            value: normal
          - dps_val: drying
            value: laundry
  - entity: fan
    name: Fan
    dps:
      - id: 4
        name: speed
        type: string
        mapping:
          - dps_val: low
            value: 50
          - dps_val: high
            value: 100
  - entity: sensor
    class: temperature
    dps:
      - id: 7
        name: sensor
        type: integer
        unit: C
        class: measurement
  - entity: switch
    translation_key: sleep
    category: config
    dps:
      - id: 14
        name: switch
        type: boolean
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 16
        name: lock
        type: boolean
  - entity: binary_sensor
    translation_key: tank_full
    dps:
      - id: 19
        name: sensor
        type: bitfield
        # The Tuya model only labels the bits E1 and E2. E2 is assumed to be
        # the water tank, by analogy with the BigDry 4000 (bit value 2).
        mapping:
          - dps_val: 2
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    dps:
      - id: 19
        name: sensor
        type: bitfield
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 19
        name: fault_code
        type: bitfield
      - id: 19
        name: description
        type: bitfield
        mapping:
          - dps_val: 0
            value: OK
          - dps_val: 1
            value: "E1"
          - dps_val: 2
            value: "Water Tank Full or Removed"
